# Postgres only. Start with `make db-up`.
#
# Kept separate from the app compose file so the database can keep running
# while the backend and frontend are rebuilt or run outside Docker.
services:
  db:
    image: postgres:18-alpine
    container_name: petter-help-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petter}
      POSTGRES_DB: ${POSTGRES_DB:-petter_help}
    ports:
      # 5433 on the host, because another Postgres already uses 5432 here.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - petter-help-pgdata:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petter} -d ${POSTGRES_DB:-petter_help}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  petter-help-pgdata:
